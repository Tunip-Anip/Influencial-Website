<!doctype html>
<html>
    <head>
        {% if title %}
        <title>{{ title }} - ColoGen</title>
        {% else %}
        <title>Welcome to ColoGen</title>
        {% endif %}
         <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <!-- The website JavaScript file -->
        <script src="script.js" defer></script>

    </head>
    <link
    rel="icon"
    href=""
    type="image/x-icon"
  />
    <body>
        {% extends "base.html" %}

        {% block content %}
            <h1>Hi, {{ current_user.username }}!</h1>
            {% for post in posts %}
            <div>
                <p>
                    {{ post.author.username }} says: <b>{{ post.body }}</b>
                </p>
            </div>
            {% endfor %}
        {% endblock %}
    </body>
</html>
