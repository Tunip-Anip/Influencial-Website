<!doctype html>
<html>
    <head >
        {% if title %}
        <title>{{ title }} - ColoGen</title>
        {% else %}
        <title>Welcome to ColoGen</title>
        {% endif %}
         <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <!-- The website JavaScript file -->
        <script src="{{url_for('static', filename='script.js')}}"></script>

    </head>
    <link
    rel="icon"
    href="{{ url_for('static', filename='Icon.ico') }}"
    type="image/x-icon"
  />
    <body style="height: 0px;" onload="Generate()">
        {% extends "base.html" %}

            <div style="text-align: center; margin-top:6vh"; display:block>

            <p style="text-align:center;margin-top:1vh;font-size:8vh;font-family:cfont" id="ColorOP">5</p>

                <div  onclick="changecol7()" onload="changecol7()">
                <div  onclick="changecol8()" onload="changecol8()">
                    <button id="colorgen0" class="buttonc" style="background-color: rgb(32, 34, 36); width: 10vw; height:10vw;border: none;outline: none;" >
                        <p id="hexa0" class="hexa" style="background-blend-mode:soft-light; text-shadow: 0 0 4px #000000, 0 0 5px #000000">HEX</p>
                        <input type="color" class="colpic" id="colpic0" style="width: 10vw; height:10vw;border: none;outline: none;">
                    </button>

                </div>
                </div>
                </div>
                </div>
                </div>
                </div>
                </div>
                </div>
            </div>
            
            <div class="switches">
                <button class="sbase" id="Creator" onclick="Create()">
                    Palette Creator
                </button>
                <button class="sbase" id="Generator" onclick="Generate()">
                    Palette Generator
                </button>
            </div>

</html>
